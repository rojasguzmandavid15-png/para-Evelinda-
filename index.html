<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feliz Día de las Flores Amarillas 🌻✨</title>

<!-- Three.js y OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #020108;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
}

/* OVERLAY DE INICIO */
#welcome-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle, #1a0f00 0%, #020108 80%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
}

#welcome-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.start-btn-container {
    text-align: center;
    animation: pulse 2s infinite ease-in-out;
}

.start-btn-container p {
    color: #ffe89e;
    font-size: 22px;
    font-family: 'Dancing Script', cursive, Georgia, serif;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(255, 216, 61, 0.8);
}

.flower-icon-btn {
    font-size: 55px;
    background: rgba(255, 216, 61, 0.15);
    border: 2px solid #ffd83d;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto;
    box-shadow: 0 0 25px #ffd83d;
    transition: transform 0.3s ease;
}

.flower-icon-btn:hover {
    transform: scale(1.15);
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* CANVAS 3D */
#galaxy-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    cursor: grab;
}

#galaxy-canvas:active {
    cursor: grabbing;
}

/* ENCABEZADO SUPERIOR */
.top-header {
    position: absolute;
    top: 3%;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
}

.top-header h1 {
    font-family: 'Dancing Script', cursive, serif;
    font-size: clamp(32px, 6vw, 55px);
    color: #fff;
    text-shadow: 
        0 0 10px #ffd83d,
        0 0 25px #ffd83d,
        0 0 50px #ffb300;
}

.top-header p {
    color: #ffe89e;
    font-size: clamp(14px, 3vw, 18px);
    margin-top: 2px;
    text-shadow: 0 0 8px rgba(255, 216, 61, 0.8);
}

/* BOTÓN DE MÚSICA */
.music-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(255, 216, 61, 0.2);
    border: 1.5px solid #ffd83d;
    color: #ffd83d;
    padding: 10px 16px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(255, 216, 61, 0.3);
    display: flex;
    align-items: center;
    gap: 6px;
}

.hint-text {
    position: absolute;
    bottom: 2.5%;
    width: 100%;
    text-align: center;
    color: rgba(255, 232, 158, 0.7);
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<!-- PANTALLA DE BIENVENIDA -->
<div id="welcome-overlay" onclick="iniciarExperiencia()">
    <div class="start-btn-container">
        <p>Toca para iniciar</p>
        <div class="flower-icon-btn">🌻</div>
    </div>
</div>

<!-- AUDIO -->
<audio id="bg-music" loop>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="musicToggle" onclick="toggleMúsica()">
    <span id="musicIcon">🎵</span> <span id="musicText">Música</span>
</button>

<!-- ENCABEZADO SUPERIOR -->
<div class="top-header">
    <h1>Feliz Día de las Flores Amarillas 🌻</h1>
    <p>✨ Para Belinda ✨</p>
</div>

<div class="hint-text">
    👆 Desliza para rotar | 🤏 Pellizca para acercar u alejar
</div>

<canvas id="galaxy-canvas"></canvas>

<script>
// ==========================================
// AUDIO Y CONTROL DE INICIO
// ==========================================
const music = document.getElementById('bg-music');
const musicIcon = document.getElementById('musicIcon');
const musicText = document.getElementById('musicText');

function iniciarExperiencia() {
    document.getElementById('welcome-overlay').classList.add('hidden');
    music.play().then(() => {
        musicIcon.textContent = "🎶";
        musicText.textContent = "Pausar";
    }).catch(() => {});
}

function toggleMúsica() {
    if (music.paused) {
        music.play();
        musicIcon.textContent = "🎶";
        musicText.textContent = "Pausar";
    } else {
        music.pause();
        musicIcon.textContent = "🎵";
        musicText.textContent = "Música";
    }
}

// ==========================================
// CONFIGURACIÓN THREE.JS
// ==========================================
const canvas = document.getElementById('galaxy-canvas');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 22, 38);

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 1.0;
controls.minDistance = 10;
controls.maxDistance = 85;

const galaxyGroup = new THREE.Group();
galaxyGroup.rotation.x = 0.35;
scene.add(galaxyGroup);

// ==========================================
// CREADOR DE ILUSTRACIONES DE FLORES (CANVAS)
// ==========================================
function drawSunflowerTexture(type) {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const ctx = c.getContext('2d');
    const cx = 128, cy = 128;

    if (type === 'sunflower') {
        // Tallo y hoja
        ctx.strokeStyle = '#4e9b26';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx, cy + 90);
        ctx.stroke();

        ctx.fillStyle = '#5ca92b';
        ctx.beginPath();
        ctx.ellipse(cx + 25, cy + 50, 20, 10, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();

        // Pétalos
        const petals = 16;
        ctx.fillStyle = '#ffcc00';
        for (let i = 0; i < petals; i++) {
            const angle = (i / petals) * Math.PI * 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, -45, 12, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Centro del Girasol
        ctx.fillStyle = '#5c3a21';
        ctx.beginPath();
        ctx.arc(cx, cy, 28, 0, Math.PI * 2);
        ctx.fill();

    } else if (type === 'bouquet') {
        // Envoltorio de Ramo
        ctx.fillStyle = '#d4ac0d';
        ctx.beginPath();
        ctx.moveTo(cx, cy + 100);
        ctx.lineTo(cx - 45, cy + 20);
        ctx.lineTo(cx + 45, cy + 20);
        ctx.closePath();
        ctx.fill();

        // Múltiples flores del ramo
        const flowerOffsets = [
            {x: 0, y: -20}, {x: -28, y: -5}, {x: 28, y: -5},
            {x: -18, y: 18}, {x: 18, y: 18}
        ];

        flowerOffsets.forEach(pos => {
            ctx.fillStyle = '#ffdb26';
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI * 2;
                ctx.save();
                ctx.translate(cx + pos.x, cy + pos.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, -18, 6, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.fillStyle = '#6e4727';
            ctx.beginPath();
            ctx.arc(cx + pos.x, cy + pos.y, 10, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    return new THREE.CanvasTexture(c);
}

function createTextTexture(text) {
    const c = document.createElement('canvas');
    c.width = 600;
    c.height = 128;
    const ctx = c.getContext('2d');

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd83d';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'Bold 32px Arial, sans-serif';
    ctx.fillText(text, 300, 64);

    return new THREE.CanvasTexture(c);
}

const texSunflower = drawSunflowerTexture('sunflower');
const texBouquet = drawSunflowerTexture('bouquet');

// ==========================================
// ELEMENTOS Y FRASES EN LA GALAXIA
// ==========================================
const frases = [
    "Hoy el amarillo lleva tu nombre", "Gracias por ser mi sol de siempre",
    "Tu risa le hace bien a mi vida", "Un girasol para quien ilumina todo",
    "Esta flor guarda un abrazo para ti", "Contigo las tardes se hacen cortas",
    "Eres mi persona favorita", "Brillas más que el sol",
    "Simplemente única", "Sonrisa encantadora", "Para la más bella"
];

const totalItems = 120;
const radiusMin = 8;
const radiusMax = 38;

for (let i = 0; i < totalItems; i++) {
    const angle = (i / totalItems) * Math.PI * 2 * 4.2;
    const radius = radiusMin + Math.pow(i / totalItems, 0.9) * (radiusMax - radiusMin);

    let spriteMaterial, scaleX, scaleY;
    const typeRand = Math.random();

    if (typeRand < 0.45) {
        // Girasoles ilustrados
        spriteMaterial = new THREE.SpriteMaterial({ map: texSunflower, transparent: true, opacity: 0.95 });
        const size = Math.random() > 0.4 ? 6.5 : 4.0;
        scaleX = size; scaleY = size;
    } else if (typeRand < 0.65) {
        // Ramos ilustrados
        spriteMaterial = new THREE.SpriteMaterial({ map: texBouquet, transparent: true, opacity: 0.95 });
        scaleX = 7.5; scaleY = 7.5;
    } else {
        // Frases flotantes
        const textStr = frases[i % frases.length];
        const texText = createTextTexture(textStr);
        spriteMaterial = new THREE.SpriteMaterial({ map: texText, transparent: true, opacity: 0.9 });
        scaleX = 10.0; scaleY = 2.1;
    }

    const sprite = new THREE.Sprite(spriteMaterial);
    sprite.position.x = Math.cos(angle) * radius;
    sprite.position.z = Math.sin(angle) * radius;
    sprite.position.y = (Math.random() - 0.5) * 4;
    sprite.scale.set(scaleX, scaleY, 1);

    sprite.userData = {
        angle: angle,
        radius: radius,
        yBase: sprite.position.y,
        floatSpeed: 0.015 + Math.random() * 0.02
    };

    galaxyGroup.add(sprite);
}

// ==========================================
// TRANSFORMATION DYNAMICS: HEART ➔ STAR ➔ CAT
// ==========================================
const particleCount = 450;
const heartTarget = new Float32Array(particleCount * 3);
const starTarget = new Float32Array(particleCount * 3);
const catTarget = new Float32Array(particleCount * 3);

// 1. PUNTOS CORAZÓN
for (let i = 0; i < particleCount; i++) {
    const t = Math.PI * 2 * Math.random();
    let hx = 16 * Math.pow(Math.sin(t), 3);
    let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    const f = 0.35;
    heartTarget[i * 3] = hx * f;
    heartTarget[i * 3 + 1] = hy * f + 2;
    heartTarget[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
}

// 2. PUNTOS ESTRELLA (5 PUNTAS)
for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const pts = 5;
    const rOuter = 5.5;
    const rInner = 2.2;
    const aStep = Math.PI / pts;
    const seg = Math.floor(angle / aStep);
    const r = (seg % 2 === 0) ? rOuter : rInner;
    
    starTarget[i * 3] = Math.cos(angle) * r * (0.6 + Math.random() * 0.4);
    starTarget[i * 3 + 1] = Math.sin(angle) * r * (0.6 + Math.random() * 0.4) + 2;
    starTarget[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
}

// 3. PUNTOS GATITO (Cabeza + Orejas + Bigotes)
for (let i = 0; i < particleCount; i++) {
    let x, y;
    const rVal = Math.random();
    if (rVal < 0.6) {
        // Cabeza
        const a = Math.random() * Math.PI * 2;
        const rad = Math.random() * 3.2;
        x = Math.cos(a) * rad;
        y = Math.sin(a) * rad;
    } else if (rVal < 0.8) {
        // Orejas
        const side = Math.random() > 0.5 ? 1 : -1;
        x = side * (1.8 + Math.random() * 1.2);
        y = 2.5 + Math.random() * 1.8;
    } else {
        // Bigotes
        const side = Math.random() > 0.5 ? 1 : -1;
        x = side * (2.2 + Math.random() * 2.0);
        y = (Math.random() - 0.5) * 1.2;
    }
    catTarget[i * 3] = x;
    catTarget[i * 3 + 1] = y + 2;
    catTarget[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
}

// Geometría dinámicamente animada
const shapeGeo = new THREE.BufferGeometry();
const currentPositions = new Float32Array(particleCount * 3);
// Inicializar en forma de corazón
for (let i = 0; i < particleCount * 3; i++) {
    currentPositions[i] = heartTarget[i];
}

shapeGeo.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
const shapeMat = new THREE.PointsMaterial({
    color: 0xffd83d,
    size: 0.55,
    transparent: true,
    opacity: 0.95
});
const morphingShape = new THREE.Points(shapeGeo, shapeMat);
galaxyGroup.add(morphingShape);

// Núcleo brillante
const coreGeo = new THREE.RingGeometry(0.8, 3.8, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffb300, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
coreMesh.rotation.x = Math.PI / 2;
coreMesh.position.y = -0.5;
galaxyGroup.add(coreMesh);

// Polvo de estrellas
const starCount = 1000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * radiusMax * 1.1;
    starPos[i] = Math.cos(a) * r;
    starPos[i+1] = (Math.random() - 0.5) * 5;
    starPos[i+2] = Math.sin(a) * r;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffe45c, size: 0.3, transparent: true, opacity: 0.7 });
galaxyGroup.add(new THREE.Points(starGeo, starMat));

// ==========================================
// ANIMACIÓN DE TRANSICIÓN Y RENDER
// ==========================================
let clockTime = 0;
let currentShapeIndex = 0; // 0: Corazón, 1: Estrella, 2: Gatito
const targets = [heartTarget, starTarget, catTarget];

setInterval(() => {
    currentShapeIndex = (currentShapeIndex + 1) % 3;
}, 4500); // Cambia de forma cada 4.5 segundos

function animate() {
    requestAnimationFrame(animate);
    clockTime += 0.02;

    controls.update();

    galaxyGroup.rotation.y += 0.0022;

    // Transición suave (Interpolación Lerp entre posiciones)
    const activeTarget = targets[currentShapeIndex];
    const positions = shapeGeo.attributes.position.array;

    for (let i = 0; i < particleCount * 3; i++) {
        positions[i] += (activeTarget[i] - positions[i]) * 0.04;
    }
    shapeGeo.attributes.position.needsUpdate = true;

    // Movimiento flotante suave
    galaxyGroup.children.forEach(child => {
        if (child.isSprite && child.userData) {
            child.position.y = child.userData.yBase + Math.sin(clockTime * child.userData.floatSpeed + child.userData.angle) * 0.8;
        }
    });

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
